# ESCI eval overrides (merged into S3ParquetQuickstart config overrides via -configFile)
# disk is ~99% full on this laptop: without this the controller rejects segment uploads (403 resource utilization)
controller.enable.resource.utilization.check=false
# 8 GB heap shared by controller+broker+3 servers+minion: the accountant's default panic level (0.99 of heap,
# measured incl. uncollected garbage) killed ordinary queries
pinot.query.scheduler.accounting.oom.panic.heap.usage.ratio=1.5
pinot.query.scheduler.accounting.oom.critical.heap.usage.ratio=1.4
pinot.query.scheduler.accounting.oom.alarming.heap.usage.ratio=1.3
